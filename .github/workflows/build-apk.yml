name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/die-again.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: die-again-android-apk
          path: output/die-again.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Die Again v1.0.0 APK Release 🎮"
          body: |
            ## 🎮 Die Again: Troll Game Ever 😈 (v1.0.0)
            
            ### ✨ Features Included:
            - **256 Unique Troll Stages** across 8 worlds
            - **10x Difficulty Multiplier** up to `10^255x` on Level 256
            - **Sequential Level Locking** (beat current level to advance)
            - **💡 Rewarded Ad Hint System** (watch 5s retro spoof ads for tactical solutions)
            - **Custom Level Editor** & On-screen Touch Controls
            
            ### 📲 How to Install:
            1. Download **`die-again.apk`** below on your Android device.
            2. Tap to install (allow "Install from Unknown Sources" if prompted).
            3. Enjoy dying again and again! 😈
          files: output/die-again.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
