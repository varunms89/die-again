name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Copy Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/die-again.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: die-again-apk
          path: output/die-again.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Die Again v1.0.0 (Android APK) 🎮"
          body: |
            ## 🎮 Die Again: Troll Game Ever 😈 (v1.0.0)

            ### 🌟 Features:
            - **256 Unique Troll Levels** across 8 worlds
            - **10x Difficulty Escalation** up to `10^255x`
            - **Sequential Level Locking** (must beat previous level to advance)
            - **💡 Rewarded Ad Hint System** (watch 5s spoof ads to unlock tactical hints)
            - **Custom Level Editor** & Arcade Touch Controls

            ---
            ### 📲 Download APK:
            Download **`die-again.apk`** below directly onto your Android device and tap to install!
          files: output/die-again.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
